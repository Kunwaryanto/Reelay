# Browser tests: the built app against a mock Supabase, in Chromium at iPhone size (tests/e2e, docs/testing.md).
name: Browser tests
on:
  push:
    branches: [sprint-2, main]
  pull_request:
  workflow_dispatch:
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build against the mock Supabase
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://mock.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: mock-key
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/e2e/requirements.txt
      - run: pip install -r tests/e2e/requirements.txt && python -m playwright install --with-deps chromium
      - name: Serve the build
        run: |
          npx vite preview --port 4317 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4317/ > /dev/null && break; sleep 1; done
      - run: python -m pytest tests/e2e -q --tb=short
