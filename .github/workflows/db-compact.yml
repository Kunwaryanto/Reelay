# Database maintenance: rewrites the busiest catalogue tables without the empty space updates leave (VACUUM FULL).
# Each table is locked for a few seconds; runs by hand, never during the nightly sync.
name: Database compact
on:
  workflow_dispatch:
concurrency:
  group: nightly-sync
  cancel-in-progress: false
jobs:
  compact:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          npx supabase link --project-ref "$PROJECT_REF"
          echo "POOLER_URL=$(cat supabase/.temp/pooler-url)" >> "$GITHUB_ENV"
      - run: node scripts/db-compact.mjs
