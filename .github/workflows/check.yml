# Catches a broken build or Vercel config before it reaches Vercel.
name: Check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: vercel.json matches Vercel's schema
        run: |
          curl -fsS https://openapi.vercel.sh/vercel.json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);delete j['\$schema'];require('fs').writeFileSync('/tmp/vercel-schema.json',JSON.stringify(j))})"
          npx -y ajv-cli@5 validate --strict=false -s /tmp/vercel-schema.json -d vercel.json
      - run: npm run lint
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_check
