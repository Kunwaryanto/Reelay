# One-off and read-only: compares Rotten Tomatoes critics' scores from MDBList (ours) with OMDb's for about 200
# titles and logs the result. Writes nothing. Needs the OMDB_API_KEY secret.
name: Compare scores
on:
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Find the database address
        run: |
          npx supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          test -s supabase/.temp/pooler-url || { echo "no pooler-url"; ls supabase/.temp; exit 1; }
          echo "POOLER_URL=$(cat supabase/.temp/pooler-url)" >> "$GITHUB_ENV"
      - run: node scripts/compare-scores.mjs
