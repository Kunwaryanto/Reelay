# Manual check of the links Streaming Availability gives for Swedish services. Runs when the probe script changes.
name: Probe app links
on:
  workflow_dispatch:
  push:
    branches: [sprint-2]
    paths: [scripts/probe-links.mjs]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/probe-links.mjs
        env:
          STREAMING_AVAILABILITY_KEY: ${{ secrets.STREAMING_AVAILABILITY_KEY }}
