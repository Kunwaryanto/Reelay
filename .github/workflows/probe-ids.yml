# One-off (removed after use): how much smaller 4-byte title and person ids would make the database. Read only.
name: probe-ids
on:
  workflow_dispatch:
    inputs:
      status_only:
        type: string
        default: ""
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          npx supabase link --project-ref "$PROJECT_REF"
          echo "POOLER_URL=$(cat supabase/.temp/pooler-url)" >> "$GITHUB_ENV"
      - run: node scripts/probe-ids.mjs
        env:
          STATUS_ONLY: ${{ inputs.status_only }}
