# Applies new files in supabase/migrations to the Supabase project when they reach main.
name: Supabase migrations
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-migrations.yml'
  workflow_dispatch:
concurrency:
  group: supabase-migrations
  cancel-in-progress: false
jobs:
  push:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
      - run: npx supabase db push --linked --yes
      - run: npx supabase migration list --linked
