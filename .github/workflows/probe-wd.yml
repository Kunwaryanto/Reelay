# One-off (removed after use): try the Wikidata award queries. Reads Wikidata only.
name: probe-wd
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/probe-wd.mjs
