# Deploys the Edge Functions in supabase/functions when they change on main.
name: Supabase functions
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', 'supabase/config.toml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # the tmdb function reads TMDB with the same key as the sync (never in the app or the repository)
      - name: Function secrets
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
        run: npx supabase secrets set --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" TMDB_READ_TOKEN="$TMDB_READ_TOKEN"
      - name: Deploy
        run: npx supabase functions deploy --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" --use-api --yes
