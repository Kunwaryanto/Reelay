# Home data only: TMDB's weekly trending lists, the members' Letterboxd feeds, and TMDB's recommendations for the
# films they rated 4 or higher. The nightly sync does the same steps; this runs them by hand, e.g. right after
# someone connects Letterboxd. Nothing else in the database is touched.
name: Home data
on:
  workflow_dispatch:
concurrency:
  group: nightly-sync
  cancel-in-progress: false
jobs:
  home:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
      SYNC_ONLY: home
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Find the database address
        run: |
          npx supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          test -s supabase/.temp/pooler-url || { echo "no pooler-url"; ls supabase/.temp; exit 1; }
          echo "POOLER_URL=$(cat supabase/.temp/pooler-url)" >> "$GITHUB_ENV"
      - run: node scripts/sync/index.mjs
