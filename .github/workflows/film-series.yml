# Which series of films each well-known film belongs to (TMDB's collections, titles.collection_id), so the walls
# show one film per series. Run once after it was added (25 Nov); the nightly sync keeps it from then on.
name: Film series
on:
  workflow_dispatch:
concurrency:
  group: nightly-sync
  cancel-in-progress: false
jobs:
  hero:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
      SYNC_ONLY: collection
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Find the database address
        run: |
          npx supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          echo "POOLER_URL=$(cat supabase/.temp/pooler-url)" >> "$GITHUB_ENV"
      - run: node scripts/sync/index.mjs

