# Every title page's picture, chosen from all of TMDB's posters and backdrops (a textless poster, else a sharp
# textless backdrop). Run once after it was added (24 Nov); the nightly sync keeps it from then on.
name: Title pictures
on:
  workflow_dispatch:
concurrency:
  group: nightly-sync
  cancel-in-progress: false
jobs:
  hero:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
      SYNC_ONLY: hero
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Find the database address
        run: |
          npx supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          echo "POOLER_URL=$(cat supabase/.temp/pooler-url)" >> "$GITHUB_ENV"
      - run: node scripts/sync/index.mjs

