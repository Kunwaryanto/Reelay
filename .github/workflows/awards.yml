# Awards only: what our titles won or were nominated for at the Oscars, Primetime Emmys and Golden Globes, from
# Wikidata. The nightly sync does the same on Sundays. Dry run counts without writing.
name: Awards
on:
  workflow_dispatch:
    inputs:
      dry:
        description: 'Dry run (count only, write nothing)'
        type: boolean
        default: false
concurrency:
  group: nightly-sync
  cancel-in-progress: false
jobs:
  awards:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
      SYNC_ONLY: awards
      AWARDS_DRY: ${{ inputs.dry && '1' || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Find the database address
        run: |
          npx supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          echo "POOLER_URL=$(cat supabase/.temp/pooler-url)" >> "$GITHUB_ENV"
      - run: node scripts/sync/index.mjs
