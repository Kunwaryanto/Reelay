# One-off: draws the title page picture three ways for three films, from TMDB's images (removed after use).
name: probe-lb
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - run: pip install pillow requests
      - run: python scripts/probe-heroes.py
      - uses: actions/upload-artifact@v4
        with:
          name: heroes
          path: heroes.png
