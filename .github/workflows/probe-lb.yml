# Temporary: read the scale of the stored Letterboxd averages.
name: Probe Letterboxd scores
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          npx supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          echo "POOLER_URL=$(cat supabase/.temp/pooler-url)" >> "$GITHUB_ENV"
      - run: node scripts/probe-lb.mjs
