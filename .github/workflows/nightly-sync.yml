# Fills the catalogue: titles streaming in Sweden, where they stream, leaving dates and scores.
# Runs every night: what streams where is updated in full, new titles are added, and the oldest 2,500 titles get
# their details refreshed. GitHub starts scheduled runs late, sometimes 8 hours, so there are two tries, 01:41 and
# 04:37 Swedish winter time (an hour later in summer); the first that starts does the sync and the later one stops at
# once (`due`; each try costs an Actions minute, so two, not four). A run started by hand always syncs.
name: Nightly sync
on:
  schedule:
    - cron: '41 0 * * *'
    - cron: '37 3 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Test on this many titles (0 = full sync)'
        default: '100'
      refresh:
        description: 'Type all to refetch every title''s details (takes hours)'
        default: ''
concurrency:
  group: nightly-sync
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  due:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          today=$(date -u +%Y-%m-%d)
          # a run of this workflow today (UTC) whose sync job succeeded
          done=0
          for id in $(gh api "repos/${{ github.repository }}/actions/workflows/nightly-sync.yml/runs?created=>=${today}&per_page=20" -q '.workflow_runs[] | select(.id != ${{ github.run_id }}) | .id'); do
            if gh api "repos/${{ github.repository }}/actions/runs/$id/jobs" -q '.jobs[] | select(.name == "sync" and .conclusion == "success") | .id' | grep -q .; then done=1; break; fi
          done
          if [ "$done" = 1 ]; then echo "Today's sync already ran"; echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi
  sync:
    needs: due
    if: needs.due.outputs.run == 'true'
    runs-on: ubuntu-latest
    # a night's sync takes about half an hour; one that hangs stops at 90 minutes instead of holding the lock (and
    # Actions minutes) for 5 hours. A refetch of every title, started by hand, keeps the long limit.
    timeout-minutes: ${{ inputs.refresh == 'all' && 300 || 90 }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
      MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
      STREAMING_AVAILABILITY_KEY: ${{ secrets.STREAMING_AVAILABILITY_KEY }}
      # for notifications; without them the sync skips that step
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      SYNC_LIMIT: ${{ inputs.limit || '0' }}
      SYNC_REFRESH: ${{ inputs.refresh }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Find the database address
        run: |
          npx supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          test -s supabase/.temp/pooler-url || { echo "no pooler-url"; ls supabase/.temp; exit 1; }
          echo "POOLER_URL=$(cat supabase/.temp/pooler-url)" >> "$GITHUB_ENV"
      - run: node scripts/sync/index.mjs
