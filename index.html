<!doctype html>
<html lang="en" style="background:#000">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Reelay</title>
    <meta name="description" content="Where films and series stream in Sweden." />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <!-- Black from the very first frame: until the stylesheet arrives, a dark-scheme page is Safari's dark grey, which showed as a one-frame flash when opening the app -->
    <style>html, body, #root { background: #000; }
      #boot { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; pointer-events: none; color: #fff; }
      #boot > span { display: block; height: 32px; }
      #boot svg { display: block; height: 100%; width: auto; overflow: visible; }
      #boot .l { transform: translateY(2200px); opacity: 0; animation: boot-rise 900ms cubic-bezier(0.16, 1, 0.3, 1) forwards, boot-fade 600ms cubic-bezier(0.4, 0, 0.6, 1) forwards; }
      #boot .l:nth-child(1) { animation-delay: 150ms; } #boot .l:nth-child(2) { animation-delay: 205ms; } #boot .l:nth-child(3) { animation-delay: 260ms; }
      #boot .l:nth-child(4) { animation-delay: 315ms; } #boot .l:nth-child(5) { animation-delay: 370ms; } #boot .l:nth-child(6) { animation-delay: 425ms; }
      #boot[data-leaving] { animation: boot-out 500ms cubic-bezier(0.22, 1, 0.36, 1) both; }
      @keyframes boot-rise { to { transform: none; } }
      @keyframes boot-fade { to { opacity: 1; } }
      @keyframes boot-out { to { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { #boot .l { animation: none; transform: none; opacity: 1; } #boot[data-leaving] { animation-duration: 1ms; } }
    </style>

    <!-- Home Screen web app (see docs/build-notes.md, Home Screen setup) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Reelay" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <!-- Plain black launch screens, one per iPhone size: iOS shows one until the page has painted, so opening the app
         never shows the web view's own dark grey for a frame -->
    <link rel="apple-touch-startup-image" href="/splash/1320x2868.png" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/1206x2622.png" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/1260x2736.png" media="(device-width: 420px) and (device-height: 912px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/1284x2778.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/1125x2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/1080x2340.png" media="(device-width: 360px) and (device-height: 780px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/1242x2688.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/828x1792.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/750x1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />

    <!-- Fonts are self-hosted (src/styles/fonts.css); preload the two every screen needs -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/material-symbols-reelay.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body style="background:#000">
    <div id="root"></div>
    <!-- The wordmark rises from the first frame, before the app's code has loaded (src/lib/boot.ts takes it over).
         Signed out, on a computer or opened at another address it fades at once. Same rise as .wordmark[data-rise]. -->
    <div id="boot" aria-hidden="true"><span><!-- boot-wordmark --></span></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
