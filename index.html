<!doctype html>
<html lang="en" style="background:#000">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Reelay</title>
    <meta name="description" content="Where films and series stream in Sweden." />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <!-- Black from the very first frame: until the stylesheet arrives, a dark-scheme page is Safari's dark grey, which showed as a one-frame flash when opening the app -->
    <style>html, body, #root { background: #000; }</style>

    <!-- Home Screen web app (see docs/build-notes.md, Home Screen setup) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Reelay" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <!-- TODO: plain black apple-touch-startup-image per iPhone size, generated in the build -->

    <!-- Fonts are self-hosted (src/styles/fonts.css); preload the two every screen needs -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/material-symbols-reelay.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body style="background:#000">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
